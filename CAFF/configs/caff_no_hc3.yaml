# ─────────────────────────────────────────────────────────────────
# CAFF-NoHC3 ablation — paper §10.1, Table 6.
#
# All architectural components active (CSV + DBM + DC) but HC3
# loss disabled. Tests the contribution of the CMI-maximization
# objective (Proposition 3) independently of the architecture.
#
# Expected (paper Table 6): Acc = 78.2, F1 = 68.8, JSD = 1.41
# ─────────────────────────────────────────────────────────────────

config:
  d: 768
  rho: 16
  L: 3
  theta: 0.50
  K_r: 20

  gamma_C: 0.25
  gamma_D: 0.20
  lambda_C: 0.35
  lambda_D: 0.40

  hc3_buffer_size: 1000
  hc3_negatives_per_anchor: 8
  hc3_buffer_refresh_steps: 500

  lr: 3.0e-4
  lr_min: 1.0e-5
  weight_decay: 1.0e-2
  batch_size: 256
  epochs: 30
  warmup_epochs: 2
  grad_clip: 1.0
  early_stop_patience: 5
  early_stop_metric: f1

  encoder_name: michiyasunaga/BioLinkBERT-large
  encoder_frozen: true

  kg_path:    data/processed/merged_kg.tsv
  train_path: data/processed/train.json
  dev_path:   data/processed/dev.json
  test_path:  data/processed/test.json

  seed: 42
  deterministic: true

  micro_batch_size: 256
  grad_accum_steps: 1
  mixed_precision: "no"

ablation:
  use_csv: true
  use_dbm: true
  use_hc3: false      # ← ablation switch
  use_dc: true
  use_freqcap: true
  csv_pool: mean
  gate_activation: sigmoid