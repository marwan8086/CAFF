# ─────────────────────────────────────────────────────────────────
# DepthBilinear baseline — paper baseline B5.
#
# Depth-stratified bilinear scorer (corrects PCE) without context
# conditioning. CAFF reduces to this when use_csv = use_dbm = false.
#
# Expected (paper Table 3): PubMedQA Acc = 76.9, MAP = 0.672
# Expected (paper Table 10): JSD = 0.00 bits (CBE signature)
#
# This is the strongest depth-stratified baseline against which
# all CAFF improvements are measured.
# ─────────────────────────────────────────────────────────────────

config:
  d: 768
  rho: 16
  L: 3
  theta: 0.50
  K_r: 20

  gamma_C: 0.25       # unused (use_hc3=false, use_dc=false)
  gamma_D: 0.20
  lambda_C: 0.0       # ← HC3 off
  lambda_D: 0.0       # ← DC  off

  hc3_buffer_size: 1000
  hc3_negatives_per_anchor: 8
  hc3_buffer_refresh_steps: 500

  lr: 3.0e-4
  lr_min: 1.0e-5
  weight_decay: 1.0e-2
  batch_size: 256
  epochs: 30
  warmup_epochs: 2
  grad_clip: 1.0
  early_stop_patience: 5
  early_stop_metric: f1

  encoder_name: michiyasunaga/BioLinkBERT-large
  encoder_frozen: true

  kg_path:    data/processed/merged_kg.tsv
  train_path: data/processed/train.json
  dev_path:   data/processed/dev.json
  test_path:  data/processed/test.json

  seed: 42
  deterministic: true

  micro_batch_size: 256
  grad_accum_steps: 1
  mixed_precision: "no"

# Strip away both context conditioning and contrastive losses
ablation:
  use_csv: false      # ← z_{ℓ-1} ≡ 0
  use_dbm: false      # ← Δ_ℓ ≡ 0
  use_hc3: false      # ← redundant with lambda_C=0
  use_dc: false       # ← redundant with lambda_D=0
  use_freqcap: true
  csv_pool: mean
  gate_activation: sigmoid