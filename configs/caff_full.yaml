# ─────────────────────────────────────────────────────────────────
# CAFF (Full) — paper §8.4 default configuration.
#
# This is the headline configuration: CSV + DBM + HC3 + DC.
# Expected results (paper Table 3, mean over 3 seeds):
#   PubMedQA  Accuracy   = 79.6
#   PubMedQA  MAP        = 0.703
#   BioASQ 7b Macro-F1   = 74.3
# ─────────────────────────────────────────────────────────────────

config:
  # Architecture
  d: 768
  rho: 16
  L: 3
  theta: 0.50
  K_r: 20

  # Loss weights & margins (paper §8.4)
  gamma_C: 0.25
  gamma_D: 0.20
  lambda_C: 0.35
  lambda_D: 0.40

  # HC3 mining (paper §6.4)
  hc3_buffer_size: 1000
  hc3_negatives_per_anchor: 8
  hc3_buffer_refresh_steps: 500

  # Optimization (paper §8.4)
  lr: 3.0e-4
  lr_min: 1.0e-5
  weight_decay: 1.0e-2
  batch_size: 256
  epochs: 30
  warmup_epochs: 2
  grad_clip: 1.0
  early_stop_patience: 5
  early_stop_metric: f1

  # Encoder
  encoder_name: michiyasunaga/BioLinkBERT-large
  encoder_frozen: true

  # Data — adjust paths to your environment
  kg_path:    data/processed/merged_kg.tsv
  train_path: data/processed/train.json
  dev_path:   data/processed/dev.json
  test_path:  data/processed/test.json

  # Reproducibility
  seed: 42
  deterministic: true

  # Hardware (overridden at runtime by detect_hardware_overrides)
  micro_batch_size: 256
  grad_accum_steps: 1
  mixed_precision: "no"

# All paper components active (no ablation)
ablation:
  use_csv: true
  use_dbm: true
  use_hc3: true
  use_dc: true
  use_freqcap: true
  csv_pool: mean
  gate_activation: sigmoid