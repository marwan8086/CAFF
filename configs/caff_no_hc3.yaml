# ----------------------------------------------------------------------
# CAFF-NoHC3 ablation (full architecture, HC3 loss disabled).
#
# All architectural components active (CSV + DBM + DC) but the
# Hop-Conditioned Context Contrast (HC3) loss is turned off. This
# isolates the contribution of the HC3 contrastive objective from
# the architectural components (CSV, DBM).
#
# Every field under `config:` is IDENTICAL to configs/caff_orphanet.yaml
# (the project headline). Only `ablation.use_hc3` differs from the
# full model, so any F1 difference vs the headline is attributable
# solely to the HC3 loss.
#
# Threshold: trained with theta=0.80, then evaluated with the same
# per-hop fine-step sweep used for the headline (Section 12 method).
# ----------------------------------------------------------------------

config:
  d: 1024
  rho: 16
  L: 3
  theta: 0.80
  K_r: 20
  gamma_C: 0.25
  gamma_D: 0.20
  lambda_C: 0.35
  lambda_D: 0.40
  hc3_buffer_size: 200
  hc3_negatives_per_anchor: 4
  hc3_buffer_refresh_steps: 100
  lr: 3.0e-4
  lr_min: 1.0e-5
  weight_decay: 1.0e-2
  batch_size: 256
  epochs: 10
  warmup_epochs: 1
  grad_clip: 1.0
  early_stop_patience: 5
  early_stop_metric: f1
  encoder_name: michiyasunaga/BioLinkBERT-large
  encoder_frozen: true
  kg_path:    data/processed/merged_kg_v2.tsv
  train_path: data/processed/train.json
  dev_path:   data/processed/dev.json
  test_path:  data/processed/test.json
  min_relation_freq: 50
  seed: 42
  deterministic: true
  micro_batch_size: 256
  grad_accum_steps: 1
  mixed_precision: "no"

ablation:
  use_csv: true         # CSV active
  use_dbm: true         # DBM active
  use_hc3: false        # HC3 loss disabled (lambda_C forced to 0)
  use_dc: true          # DC loss active
  use_freqcap: true     # BFS candidate cap (Eq. 13)
  csv_pool: mean
  gate_activation: sigmoid
