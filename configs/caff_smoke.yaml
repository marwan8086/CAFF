config:
  d: 768
  rho: 16
  L: 3  # match path lengths 1-3 in smoke data
  theta: 0.50
  K_r: 20
  gamma_C: 0.25
  gamma_D: 0.20
  lambda_C: 0.35
  lambda_D: 0.40
  hc3_buffer_size: 200
  hc3_negatives_per_anchor: 4
  hc3_buffer_refresh_steps: 100
  lr: 3.0e-4
  lr_min: 1.0e-5
  weight_decay: 1.0e-2
  batch_size: 256
  epochs: 2
  warmup_epochs: 1
  grad_clip: 1.0
  early_stop_patience: 5
  early_stop_metric: f1
  encoder_name: bert-base-uncased
  encoder_frozen: true
  kg_path:    tests/fixtures/smoke_kg.tsv
  train_path: tests/fixtures/smoke_train.json
  dev_path:   tests/fixtures/smoke_dev.json
  test_path:  tests/fixtures/smoke_test.json
  min_relation_freq: 50
  seed: 42
  deterministic: true
  micro_batch_size: 256
  grad_accum_steps: 1
  mixed_precision: "no"
ablation:
  use_csv: true
  use_dbm: true
  use_hc3: true
  use_dc: true
  use_freqcap: true
  csv_pool: mean
  gate_activation: sigmoid

